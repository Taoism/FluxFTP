<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FluxFTP is a two-pane FTP, FTPS, SFTP and cloud transfer client. Browse the Help Center and project downloads.">
  <title>FluxFTP</title>
  <style>
    :root{color-scheme:dark;--bg:#101827;--panel:#18253a;--text:#e9f1fc;--muted:#afc0d7;--accent:#82bfff;--line:#30435e}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#233d5c,var(--bg) 65%);color:var(--text);font:17px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(820px,100%);padding:clamp(28px,7vw,64px);border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--panel) 94%,transparent);box-shadow:0 24px 80px #0005}h1{font-size:clamp(42px,9vw,68px);line-height:1.05;margin:0 0 18px;letter-spacing:-.04em}.tag{color:var(--accent);font-weight:650}p{color:var(--muted);max-width:65ch}.actions{display:flex;flex-wrap:wrap;gap:12px;margin:30px 0}.button{display:inline-block;text-decoration:none;border:1px solid #52759e;border-radius:8px;padding:11px 17px;color:var(--text);font-weight:650}.button.primary{background:#2468a8;border-color:#408bd0;color:white}.button:hover{filter:brightness(1.15)}.links{border-top:1px solid var(--line);padding-top:18px;display:flex;gap:18px;flex-wrap:wrap;font-size:14px}a{color:var(--accent)}small{color:var(--muted)}
  </style>
</head>
<body><main class="card"><div class="tag">FTP · FTPS · SFTP · Cloud</div><h1>FluxFTP</h1><p>A two-pane file transfer client with recoverable queues, remote site management, synchronization, and deployment tools.</p><div class="actions"><a class="button primary" href="help/">Open the Help Center</a><a class="button" href="https://github.com/Taoism/FluxFTP/releases">Download a release</a></div><div class="links"><a href="https://github.com/Taoism/FluxFTP">Source on GitHub</a><a href="https://github.com/Taoism/FluxFTP/blob/main/docs/USER_GUIDE.md">User guide</a><a href="https://github.com/Taoism/FluxFTP/blob/main/docs/SCREENSHOTS.md">Screenshot gallery</a></div><p><small>FluxFTP is open source under the MIT License.</small></p></main></body>
</html>
