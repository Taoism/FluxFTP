name: Public Windows release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build
        required: true
        type: string
      publish_assets:
        description: Upload the ZIP and checksum to the existing GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: public-windows-release-${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-package:
    runs-on: windows-2022
    permissions:
      contents: read
    env:
      QT_QPA_PLATFORM: offscreen
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false

      - name: Verify release tag matches project version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: pwsh
        run: |
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          $projectVersion = python -c "from fluxftp import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the FluxFTP version.' }
          if ($tagVersion -ne $projectVersion) {
            throw "Release tag $tagVersion does not match pyproject version $projectVersion."
          }

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Install pinned Windows build environment
        run: |
          python -m pip install -r requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency installation failed.' }
          python -m pip install -e . --no-deps
          if ($LASTEXITCODE -ne 0) { throw 'FluxFTP installation failed.' }

      - name: Build pinned cloud backend
        run: python scripts/build_cloud_backend.py

      - name: Run release smoke checks
        run: |
          python -m pytest tests/test_tools_menu.py tests/test_deployments.py tests/test_github_artifacts.py tests/test_gitlab_artifacts.py tests/test_cloud.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Release-focused test suite failed.' }
          python -m fluxftp --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Source startup smoke check failed.' }

      - name: Build Windows application
        run: python scripts/build_development.py --cloud

      - name: Smoke-check packaged application
        run: .\dist\FluxFTP-dev\FluxFTP.exe --smoke-test

      - name: Prepare ZIP and checksums
        id: package
        shell: pwsh
        run: |
          $pythonRoot = python -c "import sys; print(sys.base_prefix)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not locate the Python installation.' }
          $pythonLicense = Join-Path $pythonRoot 'LICENSE.txt'
          if (-not (Test-Path -LiteralPath $pythonLicense)) {
            throw "Python license file was not found: $pythonLicense"
          }
          python scripts/package_windows_release.py `
            --package dist/FluxFTP-dev `
            --python-license $pythonLicense `
            --output build/public-release
          if ($LASTEXITCODE -ne 0) { throw 'Windows release packaging failed.' }
          $archive = Get-ChildItem build/public-release -Filter '*.zip' | Select-Object -First 1
          if (-not $archive) { throw 'Release ZIP was not created.' }
          "archive=$($archive.FullName)" >> $env:GITHUB_OUTPUT
          "checksums=$((Resolve-Path build/public-release/SHA256SUMS.txt).Path)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v6
        with:
          name: FluxFTP-Windows-${{ github.event.release.tag_name || inputs.release_tag }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksums }}
          if-no-files-found: error
          retention-days: 30

  publish-assets:
    needs: build-package
    if: github.event_name == 'release' || inputs.publish_assets == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: FluxFTP-Windows-${{ github.event.release.tag_name || inputs.release_tag }}
          path: build/public-release

      - name: Attach ZIP and checksum to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" build/public-release/*.zip build/public-release/SHA256SUMS.txt --clobber
