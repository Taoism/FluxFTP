name: Public multi-platform release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build
        required: true
        type: string
      publish_assets:
        description: Upload Windows, Ubuntu and Debian assets to the existing GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: public-release-${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      QT_QPA_PLATFORM: offscreen
      GOTOOLCHAIN: local
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.10'
          cache: false

      - name: Verify tag matches project version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        shell: pwsh
        run: |
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          $projectVersion = python -c "from fluxftp import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the FluxFTP version.' }
          if ($tagVersion -ne $projectVersion) {
            throw "Release tag $tagVersion does not match pyproject version $projectVersion."
          }

      - name: Install pinned Windows build environment
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw 'pip upgrade failed.' }
          python -m pip install -r requirements-windows.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency installation failed.' }
          python -m pip install -e . --no-deps
          if ($LASTEXITCODE -ne 0) { throw 'FluxFTP installation failed.' }

      - name: Build pinned cloud backend
        run: python scripts/build_cloud_backend.py

      - name: Run release smoke checks
        run: |
          python -m pytest tests/test_tools_menu.py tests/test_deployments.py tests/test_github_artifacts.py tests/test_gitlab_artifacts.py tests/test_cloud.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Release-focused test suite failed.' }
          python -m fluxftp --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Source startup smoke check failed.' }

      - name: Build and smoke-check Windows application
        run: |
          python scripts/build_development.py --cloud
          if ($LASTEXITCODE -ne 0) { throw 'Windows application build failed.' }
          .\dist\FluxFTP-dev\FluxFTP.exe --smoke-test
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows smoke check failed.' }

      - name: Prepare ZIP and checksums
        shell: pwsh
        run: |
          $pythonRoot = python -c "import sys; print(sys.base_prefix)"
          if ($LASTEXITCODE -ne 0) { throw 'Could not locate the Python installation.' }
          $pythonLicense = Join-Path $pythonRoot 'LICENSE.txt'
          if (-not (Test-Path -LiteralPath $pythonLicense)) {
            throw "Python license file was not found: $pythonLicense"
          }
          python scripts/package_windows_release.py `
            --package dist/FluxFTP-dev `
            --python-license $pythonLicense `
            --output build/public-release/windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows release packaging failed.' }

      - uses: actions/upload-artifact@v6
        with:
          name: FluxFTP-Windows-${{ github.event.release.tag_name || inputs.release_tag }}
          path: |
            build/public-release/windows/*.zip
            build/public-release/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  build-ubuntu:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Install Ubuntu build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-pip git golang-go \
            build-essential pkg-config binutils libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-xinerama0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 \
            libxcb-render-util0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 \
            libgl1 libegl1 libdbus-1-3

      - name: Verify tag matches project version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          project_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$tag_version" = "$project_version"

      - name: Build Linux package, patched rclone and checksums
        run: bash scripts/build_linux_release.sh

      - name: Stage portable archive and Debian input bundle
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          mkdir -p build/release-linux
          cp -a "dist/FluxFTP-$version-linux-x86_64" build/release-linux/
          cp "dist/FluxFTP-$version-linux-x86_64-ubuntu24.04.tar.gz" build/release-linux/
          cp dist/SHA256SUMS-linux-ubuntu24.04.txt build/release-linux/

      - uses: actions/upload-artifact@v6
        with:
          name: FluxFTP-Ubuntu-${{ github.event.release.tag_name || inputs.release_tag }}
          path: build/release-linux/*
          if-no-files-found: error
          retention-days: 30

  build-debian:
    needs: build-ubuntu
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - uses: actions/download-artifact@v6
        with:
          name: FluxFTP-Ubuntu-${{ github.event.release.tag_name || inputs.release_tag }}
          path: build/linux-input

      - name: Build and smoke-check Debian 13 installer
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          docker run --rm \
            -e PACKAGE_VERSION="$version" \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            debian:13-slim bash -euo pipefail -c '
              apt-get update
              apt-get install -y python3 dpkg-dev libatomic1 libdbus-1-3 libegl1 \
                libfontconfig1 libfreetype6 libgcc-s1 libgl1 libglib2.0-0 libstdc++6 \
                libx11-6 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
                libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-render0 \
                libxcb-shape0 libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 \
                libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0 libzstd1 zlib1g
              python3 scripts/package_deb.py \
                --bundle "build/linux-input/FluxFTP-${PACKAGE_VERSION}-linux-x86_64" \
                --output build/release-debian
              cd build/release-debian
              sha256sum "fluxftp_${PACKAGE_VERSION}-1_amd64.deb" > SHA256SUMS-debian13.txt
            '

      - uses: actions/upload-artifact@v6
        with:
          name: FluxFTP-Debian-${{ github.event.release.tag_name || inputs.release_tag }}
          path: |
            build/release-debian/*.deb
            build/release-debian/SHA256SUMS-debian13.txt
          if-no-files-found: error
          retention-days: 30

  publish-assets:
    needs: [build-windows, build-ubuntu, build-debian]
    if: github.event_name == 'release' || inputs.publish_assets == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: FluxFTP-Windows-${{ github.event.release.tag_name || inputs.release_tag }}
          path: build/public-release/windows

      - uses: actions/download-artifact@v6
        with:
          name: FluxFTP-Ubuntu-${{ github.event.release.tag_name || inputs.release_tag }}
          path: build/public-release/ubuntu

      - uses: actions/download-artifact@v6
        with:
          name: FluxFTP-Debian-${{ github.event.release.tag_name || inputs.release_tag }}
          path: build/public-release/debian

      - name: Attach all platform assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            build/public-release/windows/*.zip \
            build/public-release/windows/SHA256SUMS.txt \
            build/public-release/ubuntu/*.tar.gz \
            build/public-release/ubuntu/SHA256SUMS-linux-ubuntu24.04.txt \
            build/public-release/debian/*.deb \
            build/public-release/debian/SHA256SUMS-debian13.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
