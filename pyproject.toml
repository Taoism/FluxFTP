[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxftp"
version = "0.116.0"
description = "A modern two-pane FTP, FTPS and SFTP desktop client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "paramiko>=4,<6", "keyring>=25,<27", "cryptography>=44", "miniupnpc>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyftpdlib>=2", "pyopenssl>=25", "pyinstaller>=6", "tzdata"]

[project.gui-scripts]
fluxftp = "fluxftp.app:main"

[tool.setuptools.packages.find]
include = ["fluxftp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
