[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxftp"
version = "0.149.0"
description = "A modern two-pane FTP, FTPS and SFTP desktop client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.11.3,<7,!=6.12.0", "paramiko>=4,<6", "keyring>=25,<27", "cryptography>=44", "miniupnpc>=2.3.4,<3; platform_system != 'Windows'", "miniupnpc>=2.3.5,<3; platform_system == 'Windows'"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyftpdlib>=2", "pyopenssl>=25", "pyinstaller>=6", "tzdata"]

[project.gui-scripts]
fluxftp = "fluxftp.app:main"

[project.scripts]
fluxftp-cli = "fluxftp.cli:main"
rush_cmdline = "fluxftp.rush_cmdline:main"

[tool.setuptools.packages.find]
include = ["fluxftp*"]

[tool.setuptools.package-data]
fluxftp = ["assets/cloud-providers/*.svg", "assets/cloud-providers/*.png", "assets/fluxftp-*.svg",
           "assets/connection-states/light/*.svg", "assets/connection-states/dark/*.svg",
           "assets/trading-adapters/*.py", "assets/trading-adapters/*.mrc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

